name: Release

# Runs only when a version tag is pushed, so the signing secrets are never exposed to pull requests.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Public values baked into the app; set as repository variables (Settings > Secrets and variables > Actions > Variables).
      VITE_IDENTIFY_URL: ${{ vars.IDENTIFY_URL }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Require release variables
        env:
          IDENTIFY_URL: ${{ vars.IDENTIFY_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          missing=""
          [ -n "$IDENTIFY_URL" ] || missing="$missing IDENTIFY_URL"
          [ -n "$GOOGLE_WEB_CLIENT_ID" ] || missing="$missing GOOGLE_WEB_CLIENT_ID"
          [ -n "$RELEASE_CERT_SHA256" ] || missing="$missing RELEASE_CERT_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::Repository variables not set:$missing. Set them under Settings > Secrets and variables > Actions > Variables (see docs/setup.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        # The tests use a fake Claude; the real Worker URL must not be baked into this build.
        env:
          VITE_IDENTIFY_URL: ""
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Version from tag
        run: node scripts/version.mjs "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Build web app and sync to Android
        run: |
          npm run build
          npx cap sync android

      - name: Install Android SDK packages
        # Without pipefail the pipe's status is sdkmanager's, so `yes` dying of SIGPIPE (141) cannot fail the step.
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the signature
        env:
          # The release key's SHA-256 certificate digest (public); a mismatch fails the build.
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")
          echo "$OUT"
          if echo "$OUT" | grep -qi "Android Debug"; then echo "Signed with a debug key"; exit 1; fi
          # keytool's AB:CD:.. form (as stored) vs apksigner's plain hex
          want=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ')
          if ! echo "$OUT" | grep -qi "SHA-256 digest: $want"; then
            echo "Signing certificate does not match RELEASE_CERT_SHA256"; exit 1
          fi
          mkdir -p out
          cp "$APK" "out/the-binder-$VERSION_NAME.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "out/the-binder-$VERSION_NAME.apk" --title "The Binder $VERSION_NAME" --generate-notes
