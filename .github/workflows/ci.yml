name: CI

# Read-only: no signing secrets, no repository variables. Runs on the desk's agent/** branches (the merge waits for it) and on main;
# there are no pull requests in this single-owner repo, so add a pull_request trigger only if that changes.
on:
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job named `test` so the branch ruleset's required check always reports. A branch that changes only planning documents
  # (openspec/, docs/, markdown, the desk's todo and decision logs) finishes in seconds without building or testing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --quiet origin main
          # --no-renames lists both ends of a move, so code moved into docs/ still counts as code; a failing diff stops the step.
          files=$(git diff --no-renames --name-only origin/main...HEAD)
          if printf '%s' "$files" | grep -qvE '^(openspec/|docs/|todo\.jsonl$|decisions\.jsonl$)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only planning documents changed: skipping build and tests."
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.changes.outputs.code == 'true'
        run: npm ci

      - name: Typecheck and build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Unit tests
        if: steps.changes.outputs.code == 'true'
        run: npm test

      - name: End-to-end tests
        if: steps.changes.outputs.code == 'true'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
